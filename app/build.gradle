plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
    alias(libs.plugins.google.firebase.crashlytics)

}

android {
    namespace 'com.carro.admin'
    compileSdk 36

    defaultConfig {
        applicationId "com.carro.admin"
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName "1.1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField("String", "BASE_URL", "\"https://carrorental.in/myadmin/AdminApi/\"")

        buildConfigField("String", "BASE_IMAGE_URL", "\"https://carrorental.in/myadmin/uploads/\"")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures{
        viewBinding true
        buildConfig = true
    }
}

dependencies {
    implementation(libs.appcompat)
    implementation(libs.material)
    implementation(libs.activity)
    implementation(libs.constraintlayout)
    implementation(libs.navigation.fragment)
    implementation(libs.navigation.ui)

    testImplementation(libs.junit)
    androidTestImplementation(libs.ext.junit)
    androidTestImplementation(libs.espresso.core)

    // SDP / SSP
    implementation(libs.sdp)
    implementation(libs.ssp)

    // GIF
    implementation(libs.gif.drawable)

    // Image cropper
    implementation(libs.image.cropper)

    // Glide
    implementation(libs.glide)
    annotationProcessor(libs.glide.compiler)

    // Circle ImageView
    implementation(libs.circleimageview)

    // Retrofit / Gson / OkHttp
    implementation(libs.gson)
    implementation(libs.retrofit)
    implementation(libs.converter.gson)
    implementation(libs.logging.interceptor)

    // Loader
    implementation(libs.spinkit)

    // Firebase
    implementation(platform(libs.firebase.bom))
    implementation(libs.firebase.messaging)

    // In-app update
    implementation(libs.app.update)
    implementation(libs.app.update.ktx)


}