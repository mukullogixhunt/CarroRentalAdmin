plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.logixhunt.carrorentaladmin'
    compileSdk 36

    defaultConfig {
        applicationId "com.carro.branch"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField("String", "BASE_URL", "\"https://carrorental.in/myadmin/AdminApi/\"")

        buildConfigField("String", "BASE_IMAGE_URL", "\"https://carrorental.in/myadmin/uploads/\"")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures{
        viewBinding true
        buildConfig = true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    //region #SDP/SSP
    implementation "com.intuit.sdp:sdp-android:1.1.0"
    implementation "com.intuit.ssp:ssp-android:1.1.0"

    //Gif Imageview
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.29'

    ////cropper
    implementation "com.vanniktech:android-image-cropper:4.5.0"

    //glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    //  Circle image
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    //retrofit
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.11'

    //loader
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
}